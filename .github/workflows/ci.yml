# CI for the SCE engine — the local pre-push gates, plus the two checks that
# cannot run on the Windows dev box:
#
#   * `sh -n docker-entrypoint.sh`        (entrypoint syntax — runners have sh)
#   * the Postgres parity suite           (`tests/integration/postgresStore.test.ts`
#      is skipped without TEST_DATABASE_URL; the service container below provides
#      a throwaway database — the suite applies migrations itself and cleans up
#      its TST* fixtures afterwards)
#
# Everything else mirrors the documented routine (docs/TOKENS-DESIGN.md):
# tsc --noEmit, jest --runInBand (deterministic single-worker), build, js-yaml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: typecheck · test · build · deploy artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sce
          POSTGRES_PASSWORD: sce
          POSTGRES_DB: sce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sce -d sce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # prisma validate resolves env("DATABASE_URL") in the datasource (locally
      # provided by .env); point it at the throwaway DB — validate never connects.
      DATABASE_URL: postgresql://sce:sce@localhost:5432/sce_test
      TEST_DATABASE_URL: postgresql://sce:sce@localhost:5432/sce_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (unit + determinism + Postgres parity)
        run: npx jest --runInBand

      - name: Build
        run: npm run build

      - name: Compose files parse
        run: |
          for f in docker-compose.yml docker-compose.dokploy.yml docker-compose.dbnet.yml docker-compose.local-db.yml; do
            npx js-yaml "$f" > /dev/null && echo "ok: $f"
          done

      - name: Entrypoint shell syntax
        run: sh -n docker-entrypoint.sh

      # Advisory visibility for the *production* dependency tree. Known,
      # documented advisories (docs/SECURITY.md → "Known dependency advisories")
      # sit below `critical`, so only a new critical advisory fails the build.
      - name: Dependency audit (production, fails on critical)
        run: npm audit --omit=dev --audit-level=critical
