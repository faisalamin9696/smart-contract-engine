# Local all-in-one stack: spins up its own PostgreSQL instead of using DATABASE_URL
# from .env.
#
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d --build
#
# Overrides the connection string so the engine talks to the bundled `postgres` service.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-postgres}
      POSTGRES_DB: ${LOCAL_PG_DB:-sce}
    ports:
      - "${LOCAL_PG_BIND:-127.0.0.1}:${LOCAL_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  engine:
    environment:
      DATABASE_URL: postgresql://${LOCAL_PG_USER:-postgres}:${LOCAL_PG_PASSWORD:-postgres}@postgres:5432/${LOCAL_PG_DB:-sce}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
