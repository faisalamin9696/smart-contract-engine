# Known-vulnerability baseline for OSV-Scanner (CI scans package-lock.json on
# every push with a pinned, checksum-verified binary — see ci.yml "Supply-chain
# scan" and docs/SECURITY.md -> "Supply-chain scanning").
#
# Rules for entries below:
#   * every ignore MUST carry a written reason,
#   * dev-only status MUST be verified (`npm ls <pkg>`), not assumed,
#   * each entry names the trigger that re-opens the question.
# OSV-Scanner exits non-zero on any vulnerability NOT baselined here, so a new
# advisory on any dependency fails the next CI run.

# prisma -> @prisma/config -> deepmerge-ts (dev tooling). Absent from the runtime
# image (Dockerfile: npm ci --omit=dev); the runtime @prisma/client does not use
# it. Fixed only by a major transitive bump that risks breaking the prisma CLI
# (migrations) for zero runtime gain.
[[IgnoredVulns]]
id = "GHSA-ggr8-5vv4-36mx"
reason = "dev-only prisma tooling chain (prisma -> @prisma/config -> deepmerge-ts); absent from the runtime image; fix requires a major transitive bump - revisit with the next prisma upgrade"

# @steempro/dsteem -> secp256k1 -> elliptic (dev tooling). The advisory is an
# ECDSA *signing* fault (CVE-2025-14505): faulty k-truncation can leak a key if
# an attacker holds both a faulty and a correct signature for the same input. The
# engine runtime never signs - user transactions are signed client-side
# (Keychain), and consensus authorities arrive pre-verified from the chain. Only
# scripts/genesis.cjs (one-time operator broadcast) links this code; it reads the
# admin WIF ephemerally from env, never from the repo. No upstream fix exists
# (all elliptic versions <= 6.6.1 are affected).
[[IgnoredVulns]]
id = "GHSA-848j-6mx2-7j84"
reason = "dev-only tooling chain (dsteem -> secp256k1 -> elliptic); engine runtime never signs (Keychain/client-side signing); only the one-time genesis broadcast script links it; no upstream fix exists for <= 6.6.1 - revisit when elliptic ships one"

# ts-jest -> babel-plugin-istanbul -> js-yaml@3 -> argparse -> sprintf-js (test
# tooling). The advisory is a DoS via unbounded precision specifiers in format
# strings; in the test toolchain format strings are developer-written source,
# never attacker-controlled input. No fix available (affects <= 1.1.3).
[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
reason = "dev-only test tooling (ts-jest -> istanbul -> js-yaml@3); format strings are developer-controlled, not attacker-controlled; no fix available (<= 1.1.3)"
